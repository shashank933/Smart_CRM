services:
  app:
    image: talapelliwars/smartcrm
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.smart_crm.rule=Host(`smartcrm.shashanktalapelliwar.cloud`)
      - traefik.http.routers.smart_crm.entrypoints=websecure
      - traefik.http.routers.smart_crm.tls.certresolver=letsencrypt
      - traefik.http.services.smart_crm.loadbalancer.server.port=3001
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
     
    
    volumes:
      - server-data:/app/server/data

volumes:
  server-data:
