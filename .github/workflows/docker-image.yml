name: Docker Image CI

on:
  push:
    branches:
      - smart_crm
  pull_request:
    branches:
      - smart_crm

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smartcrm:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/smartcrm:latest \
                     ${{ secrets.DOCKER_USERNAME }}/smartcrm:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/smartcrm:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/smartcrm:${{ github.sha }}
