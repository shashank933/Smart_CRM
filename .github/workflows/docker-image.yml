name: Docker Image CI

on:
  push:
    branches:
      - smart_crm
  pull_request:
    branches:
      - smart_crm

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smartcrm:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/smartcrm:latest \
            ${{ secrets.DOCKER_USERNAME }}/smartcrm:${{ github.sha }}

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/smartcrm:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/smartcrm:${{ github.sha }}

      - name: Redeploy on VPS
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          script: |
            cd /docker/smart_crm
            docker compose up -d --pull always
            docker image prune -f
