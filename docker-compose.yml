services:
  app:
    build: .
    container_name: smartcrm
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=smart-crm-secret-key-change-in-production
      - DEEPSEEK_API_KEY=sk-298457359ee640b196546620bcc261da
      - DEEPSEEK_MODEL=deepseek-chat
    restart: unless-stopped
    volumes:
      - server-data:/app/server/data

volumes:
  server-data:
