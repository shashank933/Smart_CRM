services:
  app:
    build: .
    container_name: smartcrm
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-smartcrm-jwt-secret-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    volumes:
      - server-data:/app/server/data

volumes:
  server-data:
